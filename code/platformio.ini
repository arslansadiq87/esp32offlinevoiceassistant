[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Many ESP32-S3 boards use native USB for Serial Monitor.
; If your board uses a USB-to-UART chip and Serial does not appear,
; remove these two build flags and upload again.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Edge Impulse model export is in lib/ESP32-S3_Voice_Assistant_inferencing/
; and is included from src/main.cpp as:
;   #include <ESP32-S3_Voice_Assistant_inferencing.h>
lib_ldf_mode = deep+

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
